name: daily whisky deals

on:
  schedule:
    - cron: "17 14 * * *"   # ~8:17am Calgary in summer (MDT), 7:17am in winter (MST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending"
        type: boolean
        default: false
      shops:
        description: "Shops to update, space-separated (blank = all): bsw kwm craft"
        type: string
        default: ""
      quiet:
        description: "Only email if there's something new"
        type: boolean
        default: false

concurrency: dealfinder

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # to commit the app's data files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Price history lives in an Actions cache. If it's ever evicted the next run
      # just re-seeds (one day without alerts), nothing breaks.
      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: prices-db-

      - name: Run
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone push alerts too
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SHOPS: ${{ inputs.shops }}
          DRY_RUN: ${{ inputs.dry_run }}
          QUIET: ${{ inputs.quiet }}
        run: |
          args=()
          for s in $SHOPS; do args+=(--shop "$s"); done
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$QUIET" = "true" ] && args+=(--no-empty-email)
          python -m dealfinder run "${args[@]}"

      - name: Publish data for the app
        if: success()
        run: |
          git config user.name "whisky-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/catalog.json docs/data/deals.json docs/data/history.json docs/data/notes.json docs/data/meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update app data"
          # The app may have saved a journal entry meanwhile; it only touches journal.json, so rebase is clean.
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done

      - name: Save price history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}

      - name: Upload DB snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prices-db
          path: data/prices.db
          retention-days: 30

  publish:
    needs: run
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
