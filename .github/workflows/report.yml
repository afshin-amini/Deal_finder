name: whisky report

# Run by hand: Actions tab -> "whisky report" -> Run workflow.
# Emails every bottle matching the search, with prices and tasting notes.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Distillery or brand to search for"
        default: "Ardmore"
        required: true
      shops:
        description: "Shops, space-separated (kwm bsw craft)"
        default: "kwm"
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and email report
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          QUERY: ${{ inputs.query }}
          SHOPS: ${{ inputs.shops }}
        run: |
          args=()
          for s in $SHOPS; do args+=(--shop "$s"); done
          python -m dealfinder report "$QUERY" "${args[@]}" --out data/report.html
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisky-report
          path: data/report.html
          if-no-files-found: ignore
